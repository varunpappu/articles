cluster:
  name: minikube-localhost

destinations:
  - name: logsService
    type: loki
    url: http://loki-grafana-cloud-endpoint/loki/api/v1/push
    auth:
      type: basic
      usernameKey: lokiUsername
      passwordKey: agentToken
    secret:
      create: false
      name: k8s-monitoring
      namespace: observability

alloy-logs:
  enabled: true

podLogs:
  enabled: true
  gatherMethod: volumes

  namespaces:
    include:
      - "production"
      - "staging"
    exclude:
      - "kube-system"
      - "kube-public"

  extraDiscoveryRules: |
    - action: keep
      regex: "true"
      source_labels: [__meta_kubernetes_pod_annotation_logs_enabled]
    - action: drop
      regex: "test.*"
      source_labels: [__meta_kubernetes_pod_name]

  extraLogProcessingStages: |
    - json:
        expressions:
          level: level
          message: msg
          timestamp: ts
    - labels:
        level:
    - match:
        selector: '{level="debug"}'
        stages:
          - sampling:
              rate: 0.1

  secretFilter:
    enabled: true
    includeGeneric: true
    partialMask: 4
    replacement: "[REDACTED]"

  labelsToKeep:
    - app.kubernetes.io/name
    - app.kubernetes.io/instance
    - deployment.environment
    - level

  structuredMetadata:
    k8s.pod.name: k8s.pod.name
    k8s.pod.uid: k8s.pod.uid
    k8s.pod.ip: k8s.pod.ip